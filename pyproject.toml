[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pvdefect"
version = "0.1.0"
description = "Find hot spots in drone thermal images of a solar plant and map each one to the exact module and cell, using the camera poses and plant model of a pvmission flight plan"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohammed Alfandi" }]
requires-python = ">=3.10"
dependencies = [
    "pvmission @ git+https://github.com/Mohammedgmail/pv-drone-inspection-planner.git",
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=2.0",
    "pvlib>=0.11",
    "pillow>=10",
    "matplotlib>=3.6",
]
keywords = ["drone", "uav", "solar", "photovoltaic", "thermography", "infrared", "defect-detection", "digital-twin"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.16.8"]

[project.scripts]
pvdefect = "pvdefect.cli:main"

[project.urls]
Homepage = "https://github.com/Mohammedgmail/pv-thermal-defect-mapper"
"Flight planner" = "https://github.com/Mohammedgmail/pv-drone-inspection-planner"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pvdefect.mapper.Settings", "pvdefect.simulate.Weather", "pvdefect.simulate.Optics"]
