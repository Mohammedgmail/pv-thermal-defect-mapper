name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # also installs pvmission from the companion repo, pv-drone-inspection-planner
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - run: pytest -q
      - name: Simulate one pass with GNSS pose errors, then map it with refinement
        run: |
          pvdefect simulate examples/june-noon/mission.json --lines 3,4 --errors gnss --out ${{ runner.temp }}/survey
          pvdefect map ${{ runner.temp }}/survey --mission examples/june-noon/mission.json --refine --out ${{ runner.temp }}/results
          python -c "import json,sys; s=json.load(open(sys.argv[1])); print(s); assert s['f1'] == 1.0" ${{ runner.temp }}/results/score.json
